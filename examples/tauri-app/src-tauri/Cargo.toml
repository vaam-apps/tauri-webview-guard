[package]
name = "tauri-webview-guard-example"
version = "0.0.0"
edition = "2021"
publish = false

# Tauri's mobile targets build the app as a library — Android dlopens it and
# calls the mobile entry point from Kotlin, iOS links it statically — so the
# crate must expose one.
[lib]
name = "tauri_webview_guard_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
log = "0.4"
# A path dependency on purpose: this example exists to exercise the plugin in
# the same checkout, so a version bump cannot leave it testing an older release.
tauri-plugin-webview-guard = { path = "../../.." }

# Only so the guard's own `log` lines and this example's page-load trace reach
# logcat / the unified log, which is where docs/verification/ reads them.
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"
