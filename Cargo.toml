[package]
name = "tauri-plugin-webview-guard"
version = "0.0.0" # x-release-please-version
description = "Refuse to boot a Tauri v2 app into a WebView engine below its CSS floor, and say how to fix it in a native dialog."
authors = ["Vaam <oss@vaam.app>"]
license = "MIT"
edition = "2021"
# tauri-specta 2.0.0-rc.25 is an edition-2024 crate, which needs Rust 1.85.
rust-version = "1.85"
repository = "https://github.com/vaam-apps/tauri-webview-guard"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules", "/docs"]

# Required by `tauri-plugin`: the build script emits the mobile-project paths
# and the permission schema through this link key.
links = "tauri-plugin-webview-guard"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Exact pins, on purpose. Neither has ever had a stable 2.0 release, and
# tauri-specta's own docs say to pin with `=` during the release-candidate
# period: a minor rc bump has changed the generated bindings' shape before.
# `upstream.json` records what to re-check when either reaches 2.0.0.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
specta-typescript = "=0.0.12"
